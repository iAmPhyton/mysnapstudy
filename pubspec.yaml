name: snapstudy
description: "SnapStudy - Intelligent study companion powered by Firebase & Gemini"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core and Services
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  
  # Authentication
  google_sign_in: ^6.2.2
  
  # AI and Multimodal Processing
  google_generative_ai: ^0.4.6
  
  # Media and Utilities
  image_picker: ^1.1.2
  provider: ^6.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.3.0
  
  # UI Enhancements
  cupertino_icons: ^1.0.8
  firebase_ai: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
